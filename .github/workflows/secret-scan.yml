name: Secret scan

# Runs scripts/secret-scan.mjs over the commits a push or pull request adds. No paths filter on purpose: a secret in a
# markdown file or a lockfile-adjacent config is still a secret.

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scanner unit tests
        run: node --test scripts/secret-scan.test.mjs

      - name: Scan the commits in this push or pull request
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            # New branch or a force push that dropped the old tip: everything not already on the default branch.
            range="origin/$DEFAULT_BRANCH..$SHA"
          fi
          echo "Scanning $range"
          node scripts/secret-scan.mjs --range "$range"
